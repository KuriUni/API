<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Androidカード読み取り | TUTI</title>
  <style>
    :root{color-scheme:light;--ink:#17323a;--muted:#60777e;--line:#dbe6e8;--brand:#087e74;--soft:#eef8f6}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:#f3f7f8;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    main{width:min(100%,480px);padding:28px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 14px 40px #15333c12}.mark{display:grid;place-items:center;width:42px;height:42px;margin-bottom:20px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800}h1{margin:0 0 12px;font-size:23px}p{color:var(--muted);font-size:14px;line-height:1.8}.tip{margin-top:18px;padding:14px;border-radius:12px;background:var(--soft);color:#365c59;font-size:13px;line-height:1.75}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">T</div>
    {{CONTENT}}</main>{{SCRIPT}}</body></html>
