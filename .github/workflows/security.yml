name: Security checks

on:
  push:
    branches: ["main", "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    env:
      SUNABAR_V4_MYSQL_HOST: 127.0.0.1
      SUNABAR_V4_MYSQL_PORT: "3306"
      SUNABAR_V4_MYSQL_USER: root
      SUNABAR_V4_MYSQL_PASSWORD: root
      SUNABAR_V4_MYSQL_DATABASE: sunabar_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sunabar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xrea-source/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r xrea-source/requirements.txt
      - name: Run regression tests and Sunabar V4 MySQL integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dependency-audit:
    name: Known dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit API dependencies
        run: pip-audit -r xrea-source/requirements.txt
      - name: Audit business-ops dependencies
        run: pip-audit -r business-ops/requirements.txt

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan all fetched Git refs and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --log-opts="--all" --redact \
            --report-format json --report-path /repo/gitleaks-report.json --exit-code=0
          findings="$(jq 'length' gitleaks-report.json)"
          if [ "$findings" -gt 0 ]; then
            echo "Detected $findings historical secret candidates (values intentionally omitted):"
            jq -r '.[] | [.Fingerprint, .RuleID, .File, (.StartLine|tostring), .Commit, .Description] | @tsv' gitleaks-report.json
            rm -f gitleaks-report.json
            exit 1
          fi
          rm -f gitleaks-report.json
          echo "No historical secrets detected."
