name: Security checks

on:
  push:
    branches: ["main", "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xrea-source/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r xrea-source/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dependency-audit:
    name: Known dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit API dependencies
        run: pip-audit -r xrea-source/requirements.txt
      - name: Audit business-ops dependencies
        run: pip-audit -r business-ops/requirements.txt

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all fetched Git refs and history for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source /repo --log-opts="--all" --redact --exit-code=2
